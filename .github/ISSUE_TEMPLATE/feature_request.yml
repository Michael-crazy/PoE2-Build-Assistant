name: 功能建议
description: 想要的新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 玩的时候遇到了什么不方便
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎么做
    validations:
      required: true
  - type: dropdown
    id: realm
    attributes:
      label: 适用服务器
      options:
        - 两个服都要
        - 国际服
        - 国服（腾讯）
  - type: textarea
    id: alternatives
    attributes:
      label: 其他说明（可选）
      description: 参考的工具、截图等
