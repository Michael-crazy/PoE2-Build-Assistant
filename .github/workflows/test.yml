name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quick:
    # Offline tests only: no PoB engine, no network. Engine tests skip themselves.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same minor version as the embedded Python in the package
      - name: Privacy check
        run: python3 -B ops/check_public.py
      - name: scripts tests
        env:
          POB_ENGINE: /nonexistent
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: ops tests
        env:
          POB_ENGINE: /nonexistent
        run: python3 -B -m unittest discover -s ops -p 'test_*.py'
